<script type="text/javascript">
  RED.nodes.registerType("OpenAI API", {
    category: "AI",
    color: "#B8B1FB",
    defaults: {
      name: { value: "" },
      property: { value: "payload", required: true },
      propertyType: { value: "msg" },
      service: { value: "", type: "Service Host", required: true },
      method: { value: "", required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "icon.png",
    label: function () {
      return this.name || this.method || "OpenAI API";
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
      var selectedMethod = $("#node-input-method option:selected");
      if (!selectedMethod.val()) {
        var methods = $("#node-input-method").children();
        var firstMethod = methods.first();
        $("#node-input-method").val(firstMethod.val());
      };

      // set the default property type value to "payload"
      if (this.property === undefined) {
        $("#node-input-property").val("payload");
      }

      $("#node-input-property").typedInput({
        default: "msg",
        value: "payload",
        types: ["msg", "flow", "global"],
        typeField: "#node-input-propertyType"
      })
    }
  });
</script>

<script type="text/javascript">
  RED.nodes.registerType("Service Host", {
    category: "config",
    defaults: {
      apiBase: { value: "https://api.openai.com/v1", required: true },
      apiBaseType: { value: "str" },
      secureApiKeyHeaderOrQueryName: { value: "Authorization" },
      secureApiKeyHeaderOrQueryNameType: { value: "str" },
      organizationId: { value: "" },
      organizationIdType: { value: "str" },
      secureApiKeyIsQuery: { value: false },
      secureApiKeyValueType: { value: "cred" },
      secureApiKeyValueRef: { value: "" },
      secureAdminApiKeyValueType: { value: "cred" },
      secureAdminApiKeyValueRef: { value: "" },
      name: { value: "" },
    },
    credentials: {
      secureApiKeyValue: { type: "password" },
      secureAdminApiKeyValue: { type: "password" },
      temp: { type: "text" },
    },
    label: function () {
      return this.name || this.host;
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
      $("#node-config-input-secureApiKeyIsQuery-label").hide();
      $("#node-config-input-secureApiKeyIsQuery").hide();
      var selected = $(
        "#node-config-input-secureApiKeyIsQuery option:selected",
      );
      if (!selected.val()) {
        $("#node-config-input-secureApiKeyIsQuery").val(false);
      }

      function initializeCredentialTypedInput(fieldName) {
        const input = $(`#node-config-input-${fieldName}`);
        const typeInput = $(`#node-config-input-${fieldName}Type`);
        const refInput = $(`#node-config-input-${fieldName}Ref`);
        const existingCredValue = input.val();

        input.typedInput({
          default: "cred",
          types: ["cred", "env", "msg", "flow", "global"],
          typeField: `#node-config-input-${fieldName}Type`,
        });

        if (typeInput.val() === "cred" && existingCredValue) {
          input.typedInput("value", existingCredValue);
        }

        let previousType = input.typedInput("type");
        const syncInputValue = function () {
          const selectedType = input.typedInput("type");
          const currentValue = input.typedInput("value");

          if (selectedType !== "cred" && currentValue === "__PWRD__") {
            input.typedInput("value", refInput.val() || "");
          }

          if (selectedType === "cred" && previousType !== "cred") {
            if (currentValue === refInput.val()) {
              input.typedInput("value", "");
            }
          }

          previousType = selectedType;
        };

        if (typeInput.val() === "str") {
          input.typedInput("type", "cred");
          typeInput.val("cred");
        }

        if (typeInput.val() !== "cred" && refInput.val()) {
          input.typedInput("value", refInput.val());
        }

        syncInputValue();
        input.on("change", function () {
          syncInputValue();
        });
      }

      function saveCredentialTypedInput(fieldName) {
        const input = $(`#node-config-input-${fieldName}`);
        const typeInput = $(`#node-config-input-${fieldName}Type`);
        const refInput = $(`#node-config-input-${fieldName}Ref`);
        const selectedType = input.typedInput("type");

        typeInput.val(selectedType);

        if (selectedType !== "cred") {
          const inputValue = input.typedInput("value");
          if (inputValue && inputValue !== "__PWRD__") {
            refInput.val(inputValue);
            input.typedInput("value", "");
          }
        } else {
          refInput.val("");
        }
      }

      initializeCredentialTypedInput("secureApiKeyValue");
      initializeCredentialTypedInput("secureAdminApiKeyValue");

      [
        { input: "#node-config-input-apiBase", type: "#node-config-input-apiBaseType" },
        { input: "#node-config-input-secureApiKeyHeaderOrQueryName", type: "#node-config-input-secureApiKeyHeaderOrQueryNameType" },
        { input: "#node-config-input-organizationId", type: "#node-config-input-organizationIdType" }
      ].forEach(function (field) {
        $(field.input).typedInput({
          default: "str",
          types: ["str", "env", "msg", "flow", "global"],
          typeField: field.type,
        });
      });
    },
    oneditsave: function () {
      function saveCredentialTypedInput(fieldName) {
        const input = $(`#node-config-input-${fieldName}`);
        const typeInput = $(`#node-config-input-${fieldName}Type`);
        const refInput = $(`#node-config-input-${fieldName}Ref`);
        const selectedType = input.typedInput("type");

        typeInput.val(selectedType);

        if (selectedType !== "cred") {
          const inputValue = input.typedInput("value");
          if (inputValue && inputValue !== "__PWRD__") {
            refInput.val(inputValue);
            input.typedInput("value", "");
          }
        } else {
          refInput.val("");
        }
      }

      saveCredentialTypedInput("secureApiKeyValue");
      saveCredentialTypedInput("secureAdminApiKeyValue");
    },
  });
</script>

<script type="text/html" data-help-name="Service Host">
  <p><b>Auth Header</b>: Header name used to send the API key. Defaults to <code>Authorization</code>.</p>
  <p><b>isQuery</b>: When true, the API key is sent as a query parameter using the Auth Header value as the parameter name.</p>
  <p><b>API Key</b>: Normal API key value or typed reference. Custom header and query auth settings apply to this key only.</p>
  <p><b>Admin API Key</b>: Admin-only API key value or typed reference used for OpenAI Admin-authenticated routes.</p>
</script>
